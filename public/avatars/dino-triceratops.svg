<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img">
  <title>Triceratops</title>
  <defs>
    <g id="frill">
      <circle cx="128" cy="112" r="84"/>
      <circle cx="44" cy="112" r="16"/>
      <circle cx="50.4" cy="79.9" r="16"/>
      <circle cx="68.6" cy="52.6" r="16"/>
      <circle cx="95.9" cy="34.4" r="16"/>
      <circle cx="128" cy="28" r="16"/>
      <circle cx="160.1" cy="34.4" r="16"/>
      <circle cx="187.4" cy="52.6" r="16"/>
      <circle cx="205.6" cy="79.9" r="16"/>
      <circle cx="212" cy="112" r="16"/>
      <circle cx="205.6" cy="144.1" r="16"/>
      <circle cx="50.4" cy="144.1" r="16"/>
    </g>
  </defs>
  <rect width="256" height="256" fill="#fff3e0"/>

  <!-- frill -->
  <use href="#frill" fill="#3f3d56" stroke="#3f3d56" stroke-width="10" stroke-linejoin="round"/>
  <use href="#frill" fill="#ffb35c"/>
  <circle cx="128" cy="112" r="66" fill="#ffd38f"/>
  <g fill="#f59a3c">
    <circle cx="53.5" cy="97.2" r="5"/>
    <circle cx="64.8" cy="69.8" r="5"/>
    <circle cx="85.8" cy="48.8" r="5"/>
    <circle cx="113.2" cy="37.5" r="5"/>
    <circle cx="142.8" cy="37.5" r="5"/>
    <circle cx="170.2" cy="48.8" r="5"/>
    <circle cx="191.2" cy="69.8" r="5"/>
    <circle cx="202.5" cy="97.2" r="5"/>
  </g>

  <g stroke="#3f3d56" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- body -->
    <ellipse cx="128" cy="264" rx="86" ry="62" fill="#72cbbf"/>
    <ellipse cx="128" cy="262" rx="44" ry="36" fill="#b8ece4" stroke="none"/>

    <!-- brow horns -->
    <path d="M90,112 C84,92 78,74 80,56 C94,68 106,86 114,104 Z" fill="#fff3d6"/>
    <path d="M166,112 C172,92 178,74 176,56 C162,68 150,86 142,104 Z" fill="#fff3d6"/>

    <!-- head -->
    <ellipse cx="128" cy="150" rx="64" ry="56" fill="#72cbbf"/>
    <g fill="#5ab3a7" stroke="none">
      <circle cx="128" cy="110" r="6"/>
      <circle cx="112" cy="106" r="4"/>
      <circle cx="144" cy="106" r="4"/>
    </g>

    <!-- muzzle + nose horn -->
    <ellipse cx="128" cy="178" rx="40" ry="24" fill="#b8ece4"/>
    <path d="M119,166 Q124,150 128,140 Q132,150 137,166 Q128,170 119,166 Z" fill="#fff3d6"/>

    <!-- smile -->
    <path d="M114,192 Q128,202 142,192" fill="none"/>
  </g>

  <!-- nostrils -->
  <g fill="#3f3d56">
    <ellipse cx="116" cy="182" rx="3" ry="2.5"/>
    <ellipse cx="140" cy="182" rx="3" ry="2.5"/>
  </g>

  <!-- eyes -->
  <g fill="#2d2b3f">
    <ellipse cx="100" cy="136" rx="10" ry="12"/>
    <ellipse cx="156" cy="136" rx="10" ry="12"/>
  </g>
  <g fill="#fff">
    <circle cx="104" cy="131" r="4"/>
    <circle cx="97" cy="142" r="2"/>
    <circle cx="160" cy="131" r="4"/>
    <circle cx="153" cy="142" r="2"/>
  </g>

  <!-- blush -->
  <g fill="#ff8fa3" opacity="0.55">
    <ellipse cx="82" cy="164" rx="10" ry="6"/>
    <ellipse cx="174" cy="164" rx="10" ry="6"/>
  </g>
</svg>
