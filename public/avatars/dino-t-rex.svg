<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img">
  <title>T-Rex</title>
  <defs>
    <g id="silhouette">
      <rect x="78" y="44" width="148" height="98" rx="46"/>
      <rect x="84" y="110" width="72" height="70"/>
      <ellipse cx="112" cy="220" rx="76" ry="66"/>
    </g>
    <mask id="silhouette-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <use href="#silhouette" fill="#fff"/>
    </mask>
  </defs>
  <rect width="256" height="256" fill="#e3f2ff"/>

  <use href="#silhouette" fill="#3f3d56" stroke="#3f3d56" stroke-width="10" stroke-linejoin="round"/>
  <use href="#silhouette" fill="#84cc6c"/>

  <g mask="url(#silhouette-mask)">
    <!-- lower jaw + belly -->
    <path d="M138,110 Q182,126 222,104 L240,140 C192,150 166,160 162,196 L134,196 C138,166 140,136 138,110 Z" fill="#d4f0c4"/>
    <ellipse cx="142" cy="234" rx="40" ry="52" fill="#d4f0c4"/>
    <!-- spots -->
    <g fill="#6bb556">
      <circle cx="104" cy="64" r="7"/>
      <circle cx="88" cy="84" r="5"/>
      <circle cx="124" cy="56" r="4"/>
      <circle cx="62" cy="190" r="8"/>
      <circle cx="50" cy="216" r="5"/>
      <circle cx="78" cy="170" r="4"/>
    </g>
  </g>

  <g stroke="#3f3d56" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- mouth + teeth -->
    <path d="M138,110 Q182,126 222,104" fill="none"/>
    <path d="M161,115 L174,117 L167,127 Z" fill="#fff" stroke-width="3"/>
    <path d="M183,116 L196,114 L191,124 Z" fill="#fff" stroke-width="3"/>
  </g>

  <!-- tiny arm -->
  <path d="M164,190 Q190,184 198,204" fill="none" stroke="#3f3d56" stroke-width="18" stroke-linecap="round"/>
  <path d="M164,190 Q190,184 198,204" fill="none" stroke="#84cc6c" stroke-width="8" stroke-linecap="round"/>

  <!-- nostril -->
  <ellipse cx="212" cy="74" rx="3" ry="2.5" fill="#3f3d56"/>

  <!-- eye -->
  <ellipse cx="172" cy="78" rx="10" ry="12" fill="#2d2b3f"/>
  <circle cx="176" cy="73" r="4" fill="#fff"/>
  <circle cx="169" cy="84" r="2" fill="#fff"/>

  <!-- blush -->
  <ellipse cx="150" cy="96" rx="9" ry="6" fill="#ff8fa3" opacity="0.55"/>
</svg>
